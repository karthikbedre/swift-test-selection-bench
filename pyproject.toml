[project]
name = "tsel"
version = "0.1.0"
description = "Change-based test selection for Swift: package graph, Tree-sitter and compiler index selectors, with an evaluation harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-swift>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tsel = "tsel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tsel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
